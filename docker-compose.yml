services:
  backend:
    build:
      context: ./Backend-Atlas
    container_name: atlas-backend
    env_file:
      # Team convention (Backend-Atlas/.env.dev) first, root .env (deploy.sh) overrides it.
      # Both optional so CI and fresh clones work with only one of them.
      - path: ./Backend-Atlas/.env.dev
        required: false
      - path: .env
        required: false
    environment:
      KEYCLOAK_URL: ${INTERNAL_KEYCLOAK_URL:-http://keycloak:8080/auth}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost/auth/realms/atlas}
      KEYCLOAK_AUDIENCE: atlas-backend
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,https://localhost}
      ENABLE_DEV_TOOLS: ${ENABLE_DEV_TOOLS:-true}
    restart: unless-stopped
    volumes:
      - ./Backend-Atlas/app:/app/app
      - ./Backend-Atlas/tests:/app/tests
      - ./Backend-Atlas/requirements.txt:/app/requirements.txt
      - ocr-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./Frontend-Atlas
      target: development
    container_name: atlas-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost/auth}
      VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-atlas}
      VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_FRONT_END_CLIENT_ID:-atlas-frontend}
      VITE_CARTO_API_KEY: ${VITE_CARTO_API_KEY:-}
      VITE_ENABLE_DEV_TOOLS: ${ENABLE_DEV_TOOLS:-true}
    volumes:
      - ./Frontend-Atlas:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4.11-alpine
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker: &celery-worker-base
    build:
      context: ./Backend-Atlas
    container_name: atlas-celery-worker
    restart: unless-stopped
    env_file:
      # Team convention (Backend-Atlas/.env.dev) first, root .env (deploy.sh) overrides it.
      # Both optional so CI and fresh clones work with only one of them.
      - path: ./Backend-Atlas/.env.dev
        required: false
      - path: .env
        required: false
    environment:
      # Per-run georeferencing diagnostics -> ./Backend-Atlas/debug_runs
      # One folder per import: overlays, edge maps, gates, summary.txt.
      GEOREF_DEBUG: "false"
    volumes:
      - ./Backend-Atlas/app:/app/app
      - ./Backend-Atlas/tests:/app/tests
      - ./Backend-Atlas/debug_runs:/app/debug_runs
      - ./Backend-Atlas/requirements.txt:/app/requirements.txt
      - ocr-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info -E -Q default

  celery-worker-ocr:
    <<: *celery-worker-base
    container_name: atlas-celery-worker-ocr
    command: celery -A app.celery_app worker --loglevel=info -E -Q maps_ocr --concurrency=1 -n maps_ocr@%h

  florence-worker:
    build:
      context: ./Backend-Atlas/ocr-florence
      args:
        UID: ${UID:-1000}
    container_name: atlas-florence-worker
    restart: unless-stopped
    env_file:
      # Team convention (Backend-Atlas/.env.dev) first, root .env (deploy.sh) overrides it.
      # Both optional so CI and fresh clones work with only one of them.
      - path: ./Backend-Atlas/.env.dev
        required: false
      - path: .env
        required: false
    environment:
      SAVE_PREPROCESSED_IMAGES: "false"
    volumes:
      - ocr-data:/data
      - ./Backend-Atlas/ocr-florence:/app/ocr-florence
    depends_on:
      - redis

  flower:
    build:
      context: ./Backend-Atlas
    container_name: atlas-flower
    restart: unless-stopped
    ports:
      - "127.0.0.1:5555:5555"
    env_file:
      # Team convention (Backend-Atlas/.env.dev) first, root .env (deploy.sh) overrides it.
      # Both optional so CI and fresh clones work with only one of them.
      - path: ./Backend-Atlas/.env.dev
        required: false
      - path: .env
        required: false
    volumes:
      - ./Backend-Atlas/app:/app/app
      - ./Backend-Atlas/requirements.txt:/app/requirements.txt
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.celery_app flower --port=5555

  db:
    # Built locally: postgis/postgis has no ARM64 image (see docker/postgis/Dockerfile)
    build:
      context: ./docker/postgis
    image: atlas-postgis:17
    container_name: atlas-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./Backend-Atlas/db:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-atlas}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: atlas-keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-secret}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: false
      KC_LOG_LEVEL: WARN
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./keycloak:/var/tmp
      - ./keycloak/themes/atlas:/opt/keycloak/themes/atlas
    entrypoint: sh -c "/var/tmp/init.sh"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # No curl in the Keycloak image; health lives on the internal management port 9000
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  keycloak-db:
    image: postgres:16.15
    container_name: atlas-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.11.4-alpine
    container_name: atlas-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE: ${CADDY_SITE:-${APP_BASE_URL:-http://localhost}}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
      - keycloak

  test-backend:
    profiles: [test]
    build:
      context: ./Backend-Atlas
    command: pytest tests/ -m "integration"
    environment:
      ENABLE_DEV_TOOLS: "true"  # tests cover the dev-test API routes
    env_file:
      # Team convention (Backend-Atlas/.env.dev) first, root .env (deploy.sh) overrides it.
      # Both optional so CI and fresh clones work with only one of them.
      - path: ./Backend-Atlas/.env.dev
        required: false
      - path: .env
        required: false
    depends_on:
      - db
      - redis
      - florence-worker
    volumes:
      - ./Backend-Atlas/app:/app/app
      - ./Backend-Atlas/tests:/app/tests
      - ./Backend-Atlas/pytest.ini:/app/pytest.ini
      - ./Backend-Atlas/scripts:/app/scripts
      - ./Backend-Atlas/requirements.txt:/app/requirements.txt
      - ocr-data:/data

  # Fast georeferencing loop: no broker, no database, no pytest collection, and
  # colour extraction cached between runs. See scripts/run_georef_alignment.py.
  georef-dev:
    profiles: [tools]  # on demand only: docker compose run --rm georef-dev
    build:
      context: ./Backend-Atlas
    command: python scripts/run_georef_alignment.py
    volumes:
      - ./Backend-Atlas/app:/app/app
      - ./Backend-Atlas/tests:/app/tests
      - ./Backend-Atlas/scripts:/app/scripts
      - ./Backend-Atlas/.georef_cache:/app/.georef_cache
      - ./Backend-Atlas/ablations:/app/ablations
      - ./Backend-Atlas/requirements.txt:/app/requirements.txt
      - ocr-data:/data

  test-frontend:
    profiles: [test]
    build:
      context: ./Frontend-Atlas
      target: development
    command: npm run test:ci
    volumes:
      - ./Frontend-Atlas:/app
      - /app/node_modules

volumes:
  postgres-data:
  redis-data:
  keycloak-data:
  caddy-data:
  caddy-config:
  ocr-data:
