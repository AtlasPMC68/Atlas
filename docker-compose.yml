services:
  backend:
    build:
      context: ./Backend-Atlas
    container_name: atlas-backend
    env_file:
      - ./Backend-Atlas/.env.dev
    environment:
      KEYCLOAK_ISSUER: http://keycloak:8080/auth/realms/atlas
      KEYCLOAK_AUDIENCE: atlas-backend
    restart: unless-stopped
    volumes:
      - ./Backend-Atlas/app:/app/app
      - ./Backend-Atlas/tests:/app/tests
      - ./Backend-Atlas/requirements.txt:/app/requirements.txt
      - ./Backend-Atlas/.env.dev:/app/.env.dev
    depends_on:
      - keycloak
  frontend:
    build:
      context: ./Frontend-Atlas
    container_name: atlas-frontend
    restart: unless-stopped
    env_file:
      - ./Frontend-Atlas/.env
    volumes:
      - ./Frontend-Atlas:/app # bind mount for hot reload
      - /app/node_modules # prevent node_modules conflict

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  celery-worker:
    build:
      context: ./Backend-Atlas
    container_name: atlas-celery-worker
    restart: unless-stopped
    env_file:
      - ./Backend-Atlas/.env.dev
    volumes:
      - ./Backend-Atlas/app:/app/app
      - ./Backend-Atlas/tests:/app/tests
      - ./Backend-Atlas/requirements.txt:/app/requirements.txt
      - ./Backend-Atlas/.env.dev:/app/.env.dev
    depends_on:
      - redis
      - db
    command: celery -A app.celery_app worker --loglevel=info -E -Q default

  flower:
    build:
      context: ./Backend-Atlas
    container_name: atlas-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    env_file:
      - ./Backend-Atlas/.env.dev
    volumes:
      - ./Backend-Atlas/app:/app/app
      - ./Backend-Atlas/requirements.txt:/app/requirements.txt
      - ./Backend-Atlas/.env.dev:/app/.env.dev
    depends_on:
      - redis
    command: celery -A app.celery_app flower --port=5555

  db:
    image: postgis/postgis:latest
    container_name: atlas-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    platform: linux/amd64
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./Backend-Atlas/db:/docker-entrypoint-initdb.d

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: atlas-keycloak
    restart: unless-stopped
    environment:
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      # Database configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      # Simple development configuration
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY: edge

      # Disable health checks and metrics to avoid connection issues
      KC_HEALTH_ENABLED: false
      KC_METRICS_ENABLED: false

      # Logging
      KC_LOG_LEVEL: WARN
    volumes:
      - ./keycloak:/var/tmp
    entrypoint: sh -c "/var/tmp/init.sh"
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:16
    container_name: atlas-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: atlas-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
      - keycloak

  test-backend:
    build:
      context: ./Backend-Atlas
    command: pytest tests/ -v --color=yes --tb=short
    depends_on:
      - backend
      - db
      - redis
    volumes:
      - ./Backend-Atlas/app:/app/app
      - ./Backend-Atlas/tests:/app/tests
      - ./Backend-Atlas/requirements.txt:/app/requirements.txt
      - ./Backend-Atlas/.env.dev:/app/.env.dev

  test-frontend:
    build:
      context: ./Frontend-Atlas
    command: npm test
    volumes:
      - ./Frontend-Atlas:/app
      - /app/node_modules

volumes:
  postgres-data:
  redis-data:
  keycloak-data:
  caddy-data:
  caddy-config:
