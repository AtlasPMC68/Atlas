# Docker Compose configuration for OCR standalone services and workers
services:
  ocr-base:
    build:
      context: .
      dockerfile: Dockerfile.base
      args:
        UID: ${UID:-1000}
    image: atlas-ocr-base

  paddle-worker:
    build:
      context: ./paddle
      additional_contexts:
        ocr-base: service:ocr-base
    container_name: atlas-paddle-worker
    restart: unless-stopped
    env_file:
      - ../.env.dev
    volumes:
      - ocr-data:/data
      - ./paddle:/app/paddle
    depends_on:
      - redis
      - ocr-base


