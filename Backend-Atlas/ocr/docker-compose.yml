# Standalone from the main stack, runs the backend's OCR code (app/utils/ocr) on
# the test images. From the repo root:
#   docker compose -f Backend-Atlas/ocr/docker-compose.yml run --rm ocr-proto
services:
  ocr-proto:
    build:
      context: ..
    image: atlas-ocr-proto
    working_dir: /app/ocr
    command: python3 -u run.py
    environment:
      ASSETS_DIR: /assets
      OUTPUT_DIR: /output
      PYTHONPATH: /app
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      # Reader model, downloaded on first use if it isn't the image's default
      OCR_REC_MODEL: ${OCR_REC_MODEL:-latin_PP-OCRv5_mobile_rec}
    volumes:
      - ../app:/app/app:ro
      - ../tests/assets:/assets:ro
      # Live-mounted so edits to the prototype don't need a rebuild.
      - .:/app/ocr
      - ./outputs:/output
