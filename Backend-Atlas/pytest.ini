# ==============================================================================
# CONFIGURATION DES LOGS EN DIRECT (CLI) DANS PYTEST
# ==============================================================================
# Ajustez les paramètres ci-dessous selon le niveau de visibilité souhaité :
#
# Résumés + Écarts de mots (Configuration actuelle) :
#    log_cli = true
#    log_cli_level = WARNING
#
# Uniquement les vrais échecs FAIL :
#    (Masque les avertissements et les mismatches partiels)
#    log_cli = true
#    log_cli_level = ERROR
#
# Aucun log en direct :
#    (Console pytest classique avec uniquement les indicateurs de succès/échec ./F)
#    log_cli = false
# ==============================================================================
[pytest]
log_cli = true
log_cli_level = WARNING
filterwarnings =
    ignore:.*Please use `import python_multipart` instead.*:PendingDeprecationWarning
    ignore::PendingDeprecationWarning:starlette.formparsers

