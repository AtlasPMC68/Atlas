[pytest]
log_cli = true
log_cli_level = WARNING

# Granular log detail for text extraction tests:
# - true  : Displays OCR pipeline INFO progress AND full word details (Unrecognized geocache, Detection mismatches)
# - false : Displays only compact summary (Hit rate, Distance, OCR Words, Geocache count) without word-level breakdown or OCR progress
extraction_log_info = true

filterwarnings =
    ignore:.*Please use `import python_multipart` instead.*:PendingDeprecationWarning
    ignore::PendingDeprecationWarning:starlette.formparsers
