name: CI - Atlas Project Tests

on:
  push:
    branches:
      - "*"

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env.dev file from secret
        run: |
          if [ -n "${{ secrets.ENV_DEV }}" ]; then
            echo "${{ secrets.ENV_DEV }}" > ./Backend-Atlas/.env.dev
          elif [ ! -f "./Backend-Atlas/.env.dev" ]; then
            touch ./Backend-Atlas/.env.dev
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clean stale volumes and containers
        run: docker compose down -v --remove-orphans || true

      - name: Build testing services
        run: docker compose build test-backend florence-worker qwen-worker
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Run fast unit tests in parallel
        run: >
          docker compose run --rm -q test-backend
          pytest tests/ -n auto -v --color=yes --tb=short -rA
          -m "not integration and not slow"

      - name: Run OCR integration tests sequentially
        run: >
          docker compose run --rm -q test-backend
          pytest tests/ -v --color=yes --tb=short -rA -o log_cli=true --log-cli-level=INFO
          -m "integration"

