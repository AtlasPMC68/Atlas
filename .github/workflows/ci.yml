name: CI - Atlas Project Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env files
        run: |
          if [ -n "${{ secrets.ENV_DEV }}" ]; then
            echo "${{ secrets.ENV_DEV }}" > ./Backend-Atlas/.env.dev
          elif [ ! -f "./Backend-Atlas/.env.dev" ]; then
            touch ./Backend-Atlas/.env.dev
          fi
          touch ./Frontend-Atlas/.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build testing services
        id: build
        run: |
          docker compose build -q \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            test-backend test-frontend
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Run frontend unit tests 
        if: steps.build.outcome == 'success'
        run: >
          docker compose run --rm -q test-frontend
          
      - name: Run backend unit tests in parallel
        if: steps.build.outcome == 'success' && !cancelled()
        run: >
          docker compose run --rm -q test-backend
          pytest tests/ -n auto -v --color=yes --tb=short -rA
          -m "not integration and not slow"

      - name: Run OCR integration tests sequentially
        if: steps.build.outcome == 'success' && !cancelled()
        run: |
          docker compose run --rm -q test-backend pytest tests/ -m "integration"