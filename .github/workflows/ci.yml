name: CI - Atlas Project Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Shell scripts committed from Windows lose the executable bit (core.fileMode=false),
      # and the server then refuses to run them (e.g. ci-deploy.sh via authorized_keys).
      - name: Check shell scripts are executable
        run: |
          bad=$(git ls-files -s -- '*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$bad" ]; then
            echo "::error::Not executable in git (expected mode 100755):"
            echo "$bad"
            echo "Fix with: git update-index --chmod=+x <file>"
            exit 1
          fi

      - name: Create .env files
        run: |
          if [ -n "${{ secrets.ENV_DEV }}" ]; then
            echo "${{ secrets.ENV_DEV }}" > ./Backend-Atlas/.env.dev
          elif [ ! -f "./Backend-Atlas/.env.dev" ]; then
            touch ./Backend-Atlas/.env.dev
          fi
          touch ./Frontend-Atlas/.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build testing services
        id: build
        run: |
          docker compose build -q \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            test-backend florence-worker test-frontend
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Run frontend unit tests 
        if: steps.build.outcome == 'success'
        run: >
          docker compose run --rm -q test-frontend
          
      - name: Run backend unit tests in parallel
        if: steps.build.outcome == 'success' && !cancelled()
        run: >
          docker compose run --rm -q test-backend
          pytest tests/ -n auto -v --color=yes --tb=short -rA
          -m "not integration and not slow"

      - name: Run OCR integration tests sequentially
        if: steps.build.outcome == 'success' && !cancelled()
        run: |
          docker compose up -d florence-worker
          docker compose run --rm -q test-backend pytest tests/ -m "integration"

  # Redeploys the server after every merge into main, once the tests pass.
  # "Run workflow" on main redeploys by hand.
  # Setup (deploy key, secrets): "Déploiement automatique" in docs/deploiement/README.md
  deploy:
    needs: tests
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN }}
    # Two merges close together deploy one after the other, never interrupted
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Install deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy)
          # Pinned server fingerprint: the connection fails if the server changes
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on the server
        # The key only runs scripts/ci-deploy.sh on the server; the SHA is its only input
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: >
          ssh -i ~/.ssh/id_deploy
          -o BatchMode=yes -o StrictHostKeyChecking=yes
          -o ServerAliveInterval=30 -o ServerAliveCountMax=10
          "ubuntu@$DEPLOY_HOST" "$DEPLOY_SHA"

      - name: Smoke test
        env:
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: >
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors
          "https://$DEPLOY_DOMAIN/api/ping"

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/id_deploy