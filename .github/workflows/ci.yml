name: CI - Atlas Project Tests

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create .env.dev file from secret
        run: |
          echo "${{ secrets.ENV_DEV }}" > ./Backend-Atlas/.env.dev

      - name: Set up Docker Compose
        run: |
          docker compose version

      - name: Build all services
        run: docker compose build

      # - name: Run backend unit tests
      #   run: docker compose run --rm test-backend

      - name: Run backend OCR integration tests
        run: |
          docker compose run --rm \
            -e ATLAS_RUN_OCR_INTEGRATION_TESTS=1 \
            test-backend \
            pytest tests/integration/test_ocr.py

